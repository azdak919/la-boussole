name: Vérification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

# Check requis pour merger dans main (branch protection / ruleset) :
# le job s’appelle « test » — ne pas le renommer sans mettre à jour
# VisualCode/GIT-AND-TEST-SAFETY.md §9 et la protection GitHub.
#
# Ce dépôt est un journal. La vérification exécute les tests ; elle ne
# publie pas. « Publier le journal » est le seul déploiement : publier ici
# la vitrine du Kiosque écraserait le site du journal.
jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: |
          set -euo pipefail
          n=1
          until npm ci; do
            if [ "$n" -ge 3 ]; then exit 1; fi
            echo "npm ci interrompu ($n/3), nouvel essai."
            sleep $((n * 5))
            n=$((n+1))
          done
      - run: npm test

  navigateur:
    name: navigateur
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: |
          set -euo pipefail
          n=1
          until npm ci; do
            if [ "$n" -ge 3 ]; then exit 1; fi
            echo "npm ci interrompu ($n/3), nouvel essai."
            sleep $((n * 5))
            n=$((n+1))
          done
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          n=1
          until npx playwright install chromium; do
            if [ "$n" -ge 3 ]; then exit 1; fi
            echo "Installation de Chromium interrompue ($n/3), nouvel essai."
            sleep $((n * 5))
            n=$((n+1))
          done
      - run: BASE=/autre-nom npm run site && npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
